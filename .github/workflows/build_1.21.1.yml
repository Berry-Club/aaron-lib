name: Java CI (1.21.1)

on:
    push:
        branches:
            - '1.21.1-Neoforge'
    workflow_dispatch:
        branches:
            - '1.21.1-Neoforge'
        inputs:
            release_type:
                description: 'Release Type'
                required: true
                type: choice
                default: 'release'
                options:
                    - 'release'
                    - 'beta'
                    - 'alpha'
                    - 'none'

jobs:
    build:
        runs-on: ubuntu-latest
        if: |
            !contains(github.event.head_commit.message, '[ci skip]')
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 5

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: '21'
                  cache: gradle

            - name: Grant execute permission for gradlew
              run: chmod +x gradlew

            - name: Validate Gradle Wrapper
              uses: gradle/wrapper-validation-action@v3

            - name: Build with Gradle
              uses: gradle/gradle-build-action@v3
              with:
                  arguments: build -x test --stacktrace

            - name: Publish to latvian.dev Maven
              uses: gradle/gradle-build-action@v3
              env:
                  MAVEN_URL: 'https://maven.latvian.dev/releases'
                  MAVEN_USERNAME: 'aaron'
                  MAVEN_TOKEN: ${{ secrets.LAT_MAVEN_TOKEN }}
              with:
                  arguments: publish --stacktrace

            - name: Read release properties
              id: release-properties
              if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type != 'none' }}
              shell: bash
              run: |
                  mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
                  echo "mod-version=$mod_version" >> "$GITHUB_OUTPUT"
                  echo "changelog-anchor=${mod_version//./}" >> "$GITHUB_OUTPUT"
                  sed -n \
                    -e 's/^minecraft_version=/minecraft-version=/p' \
                    -e 's/^curseforge_id=/curseforge-id=/p' \
                    -e 's/^modrinth_id=/modrinth-id=/p' \
                    gradle.properties >> "$GITHUB_OUTPUT"

            - name: Release to CurseForge and Modrinth
              uses: Kira-NT/mc-publish@v3
              if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type != 'none' }}
              with:
                  curseforge-id: ${{ steps.release-properties.outputs.curseforge-id }}
                  curseforge-token: ${{ secrets.CURSEFORGE_KEY }}
                  modrinth-id: ${{ steps.release-properties.outputs.modrinth-id }}
                  modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
                  files: build/libs/!(*-@(dev|sources|javadoc)).jar
                  name: Aaron ${{ steps.release-properties.outputs.minecraft-version }} ${{ steps.release-properties.outputs.mod-version }}-build.${{ github.run_number }}
                  version: ${{ steps.release-properties.outputs.mod-version }}-build.${{ github.run_number }}
                  version-type: ${{ inputs.release_type }}
                  changelog: https://github.com/Berry-Club/aaron-lib/blob/master/CHANGELOG.md#${{ steps.release-properties.outputs.changelog-anchor }}
                  loaders: neoforge
                  game-versions: ${{ steps.release-properties.outputs.minecraft-version }}
                  dependencies: kotlin-for-forge(required)
